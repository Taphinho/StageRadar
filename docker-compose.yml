services:
  stageradar:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGERADAR_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      STAGERADAR_DATA_DIR: /data
    volumes:
      - stageradar-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  stageradar-data:
